# Production stack for a manual VPS. Front this with host Nginx + Certbot (docs/deployment.md).
# Differences from the dev docker-compose.yml:
#  - backend is published to 127.0.0.1 only (Nginx is the public edge; nothing else is exposed)
#  - a shared `appdata` volume is mounted at /data in backend + both workers, so the DAG's
#    upload_file step can read the file that generate_report wrote on another worker (GUARDRAILS §6)
#  - restart policies + TZ=UTC + secrets pulled from .env (never committed)

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - TZ=UTC
      - DLQ_ALERT_EMAIL=${DLQ_ALERT_EMAIL}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:3000:3000"   # localhost only — Nginx terminates TLS and proxies here
    depends_on:
      - postgres

  worker-1:
    build:
      context: .
      dockerfile: worker.Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_ID=worker-1
      - TZ=UTC
    volumes:
      - appdata:/data
    depends_on:
      - postgres

  worker-2:
    build:
      context: .
      dockerfile: worker.Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WORKER_ID=worker-2
      - TZ=UTC
    volumes:
      - appdata:/data
    depends_on:
      - postgres

volumes:
  pgdata:
  appdata:
