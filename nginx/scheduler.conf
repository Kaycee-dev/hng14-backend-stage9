# Stage 9 — Nginx reverse proxy for a manual VPS.
# Install as a host Nginx site (see docs/deployment.md), replace the server_name,
# then run `sudo certbot --nginx -d YOUR_SUBDOMAIN.duckdns.org` — Certbot rewrites
# this file to add the :443 server block, cert paths, and an 80 -> 443 redirect.
#
# The dockerized backend serves BOTH the built UI and the API on 127.0.0.1:3000,
# so everything proxies to one upstream; only the SSE location needs special handling.

server {
    listen 80;
    server_name YOUR_SUBDOMAIN.duckdns.org;

    # UI + API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events — buffering MUST be off or the live UI never receives events.
    location /api/events/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
